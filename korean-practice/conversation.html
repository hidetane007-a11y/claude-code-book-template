<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>会話練習 | 韓国語練習</title>
  <link rel="stylesheet" href="./css/common.css">
  <style>
    /* シナリオカード */
    .scenario-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .scenario-card:active {
      box-shadow: 0 2px 8px rgba(16,185,129,0.15);
      border-color: var(--conversation);
    }
    .scenario-card + .scenario-card { margin-top: 10px; }
    .scenario-emoji { font-size: 2.25rem; flex-shrink: 0; }
    .scenario-info { flex: 1; }
    .scenario-name { font-size: 1rem; font-weight: 700; }
    .scenario-name-kr { font-size: 0.8125rem; color: var(--muted); }
    .scenario-desc { font-size: 0.8125rem; color: var(--muted); margin-top: 2px; }
    .scenario-done { color: var(--conversation); font-size: 1.25rem; }

    /* チャット */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 160px;
    }
    .msg-bubble {
      max-width: 85%;
      border-radius: 16px;
      padding: 12px 14px;
      line-height: 1.5;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--conversation);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-ai .reply-kr {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .msg-ai .reply-romanization {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .msg-ai .reply-jp {
      font-size: 0.8125rem;
      color: #475569;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 6px;
    }
    .msg-ai .correction-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 0.8125rem;
      color: #92400E;
    }
    .msg-ai .correction-box strong { color: #B45309; }
    .msg-ai .vocab-area {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .vocab-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #EFF6FF;
      color: var(--primary);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .vocab-chip:hover { background: #DBEAFE; }

    /* 発話中インジケーター */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--muted);
      border-radius: 50%;
      animation: typingBounce 1.2s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    /* 入力エリア */
    .chat-input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
      line-height: 1.4;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: var(--conversation); }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--conversation);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.5; }
    .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .mic-btn.listening {
      background: #FEE2E2;
      border-color: var(--danger);
      animation: pulse 1s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }
    .chat-hint {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 6px;
    }

    /* サマリー */
    .summary-emoji { font-size: 4rem; text-align: center; display: block; margin-bottom: 16px; }
    .summary-title { font-size: 1.375rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .summary-sub { text-align: center; color: var(--muted); margin-bottom: 24px; }
    .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 700; color: var(--conversation); }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* APIキー設定モーダル */
    .kp-modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px; }
    .kp-modal-box { background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.2); }
    .kp-modal-box input { width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:0.875rem;box-sizing:border-box;margin-bottom:12px; }
    .kp-api-notice { background:#FEF3C7;border:1px solid #F59E0B;border-radius:10px;padding:10px 14px;font-size:0.8125rem;margin-bottom:12px;display:flex;align-items:center;gap:8px; }
    .kp-api-key-btn { background:none;border:none;font-size:1.1rem;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted); }

    /* チャット画面専用レイアウト */
    #screen-chat {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #screen-chat.active {
      display: flex;
    }
    #chat-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- ===== シナリオ選択 ===== -->
  <div id="screen-scenarios" class="screen active" style="min-height:100vh;">
    <div class="page-header">
      <a href="./index.html" class="back-btn">←</a>
      <h1>💬 会話練習</h1>
    </div>
    <div class="page-content">
      <div id="kp-api-notice" class="kp-api-notice" style="display:none">
        ⚠️ <span>Anthropic APIキーが未設定です。</span>
        <button class="btn btn-sm btn-outline" style="margin-left:auto;white-space:nowrap" onclick="kpShowApiKeyModal()">設定する</button>
      </div>
      <div class="section-title">シナリオを選ぶ</div>
      <div id="scenario-list"></div>
    </div>
  </div>

  <!-- ===== チャット画面 ===== -->
  <div id="screen-chat" class="screen">
    <div id="chat-header">
      <button class="back-btn" onclick="endChat()">←</button>
      <span id="chat-title" style="font-weight:700; font-size:1rem; flex:1;">カフェ</span>
      <button class="kp-api-key-btn" onclick="kpShowApiKeyModal()" title="APIキー設定">⚙️</button>
      <button class="btn btn-sm btn-outline" onclick="endChat()">終わる</button>
    </div>
    <div id="chat-area"></div>
    <div class="chat-input-area">
      <div class="chat-hint" id="chat-hint">日本語または韓国語でメッセージを送ってください</div>
      <div class="chat-input-row">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="音声入力">🎤</button>
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="メッセージを入力..." onkeydown="handleInputKeydown(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- ===== サマリー画面 ===== -->
  <div id="screen-summary" class="screen" style="min-height:100vh;">
    <div class="page-header">
      <h1>💬 会話練習</h1>
    </div>
    <div class="page-content">
      <span class="summary-emoji">🎉</span>
      <div class="summary-title">お疲れさまでした！</div>
      <div class="summary-sub" id="summary-scenario"></div>
      <div class="summary-stats">
        <div class="stat-card">
          <div class="stat-num" id="summary-turns">0</div>
          <div class="stat-label">会話ターン</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="summary-words">0</div>
          <div class="stat-label">追加単語</div>
        </div>
      </div>
      <button class="btn btn-conversation btn-full btn-lg" onclick="restartChat()">もう一度</button>
      <button class="btn btn-outline btn-full btn-lg mt-12" onclick="KoreanNav.showScreen('screen-scenarios')">シナリオ選択へ</button>
      <a href="./index.html" class="btn btn-ghost btn-full mt-8">ホームへ</a>
    </div>
  </div>

  <!-- ボトムナビ -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="./index.html">
      <span class="nav-icon">🏠</span>
      ホーム
    </a>
    <a href="./wordbook.html">
      <span class="nav-icon">📖</span>
      単語帳
    </a>
    <a href="./index.html">
      <span class="nav-icon">📊</span>
      記録
    </a>
  </nav>

  <!-- APIキー設定モーダル -->
  <div id="kp-api-modal" class="kp-modal-overlay" style="display:none" onclick="if(event.target===this)kpCloseApiKeyModal()">
    <div class="kp-modal-box">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px;">🔑 Anthropic APIキー設定</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:14px;">GitHub Pages版の会話練習に必要です。キーはこのデバイスのみに保存されます。</div>
      <input id="kp-api-input" type="password" placeholder="sk-ant-..." autocomplete="off">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="kpCloseApiKeyModal()">キャンセル</button>
        <button class="btn btn-conversation btn-sm" style="flex:1" onclick="kpSaveApiKey()">保存</button>
      </div>
      <div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--conversation);">APIキーを取得する →</a>
      </div>
    </div>
  </div>

  <script src="./js/state.js"></script>
  <script src="./js/speech.js"></script>
  <script src="./js/nav.js"></script>
  <script>
  // シナリオデータをインライン定義（外部ファイル読み込み失敗を防ぐ）
  window.SCENARIOS = [
    {
      id: 'cafe', name: 'カフェ', nameKr: '카페', emoji: '☕',
      description: '注文や雑談の練習',
      systemPrompt: 'あなたは韓国語会話練習のカフェ（카페）の店員です。ユーザーが日本語または韓国語で話しかけます。必ず以下のJSON形式のみで返答してください（他のテキストは含めない）:\n{"reply_kr":"韓国語の返答","reply_jp":"日本語訳","romanization":"ローマ字読み","correction":null,"vocabulary":[{"kr":"단어","jp":"意味"}]}\ncorrectionはユーザーの韓国語入力に文法・語彙ミスがあった場合のみ文字列で指摘。なければnull。vocabularyは重要単語を1〜3個。設定: ソウルのカフェ。メニュー: 아메리카노・카페라떼・녹차라떼・케이크。'
    },
    {
      id: 'airport', name: '空港', nameKr: '공항', emoji: '✈️',
      description: 'チェックインや案内の練習',
      systemPrompt: 'あなたは韓国語会話練習の空港（공항）の地上係員です。ユーザーが日本語または韓国語で話しかけます。必ず以下のJSON形式のみで返答してください（他のテキストは含めない）:\n{"reply_kr":"韓国語の返答","reply_jp":"日本語訳","romanization":"ローマ字読み","correction":null,"vocabulary":[{"kr":"단어","jp":"意味"}]}\ncorrectionはユーザーの韓国語入力に文法・語彙ミスがあった場合のみ文字列で指摘。なければnull。vocabularyは重要単語を1〜3個。設定: 仁川国際空港のチェックインカウンター。丁寧なフォーマル語で応対。'
    },
    {
      id: 'restaurant', name: 'レストラン', nameKr: '식당', emoji: '🍽️',
      description: '注文・食べ物の話題',
      systemPrompt: 'あなたは韓国語会話練習のレストラン（식당）の店員です。ユーザーが日本語または韓国語で話しかけます。必ず以下のJSON形式のみで返答してください（他のテキストは含めない）:\n{"reply_kr":"韓国語の返答","reply_jp":"日本語訳","romanization":"ローマ字読み","correction":null,"vocabulary":[{"kr":"단어","jp":"意味"}]}\ncorrectionはユーザーの韓国語入力に文法・語彙ミスがあった場合のみ文字列で指摘。なければnull。vocabularyは重要単語を1〜3個。設定: ソウル明洞の韓国料理店。メニュー: 비빔밥・불고기・삼겹살・냉면・김치찌개。'
    },
    {
      id: 'shopping', name: 'ショッピング', nameKr: '쇼핑', emoji: '🛍️',
      description: '値段交渉・商品説明の練習',
      systemPrompt: 'あなたは韓国語会話練習のショッピングモール（쇼핑몰）の店員です。ユーザーが日本語または韓国語で話しかけます。必ず以下のJSON形式のみで返答してください（他のテキストは含めない）:\n{"reply_kr":"韓国語の返答","reply_jp":"日本語訳","romanization":"ローマ字読み","correction":null,"vocabulary":[{"kr":"단어","jp":"意味"}]}\ncorrectionはユーザーの韓国語入力に文法・語彙ミスがあった場合のみ文字列で指摘。なければnull。vocabularyは重要単語を1〜3個。設定: 東大門市場の衣料品店。値引き交渉可能。'
    },
    {
      id: 'directions', name: '道案内', nameKr: '길 안내', emoji: '🗺️',
      description: '場所の尋ね方・説明の練習',
      systemPrompt: 'あなたは韓国語会話練習で道を尋ねられる通行人（행인）です。ユーザーが日本語または韓国語で話しかけます。必ず以下のJSON形式のみで返答してください（他のテキストは含めない）:\n{"reply_kr":"韓国語の返答","reply_jp":"日本語訳","romanization":"ローマ字読み","correction":null,"vocabulary":[{"kr":"단어","jp":"意味"}]}\ncorrectionはユーザーの韓国語入力に文法・語彙ミスがあった場合のみ文字列で指摘。なければnull。vocabularyは重要単語を1〜3個。設定: ソウル弘大付近の街中。直진・왼쪽・오른쪽などを使って案内。'

  <script>
    let currentScenario = null;
    let messages = [];
    let sessionWords = 0;
    let sessionTurns = 0;

    // シナリオ一覧を描画
    function renderScenarios() {
      const scenarios = window.SCENARIOS;
      if (!scenarios || !scenarios.length) {
        console.error('[korean] SCENARIOS not loaded');
        document.getElementById('scenario-list').innerHTML =
          '<p style="color:var(--danger);padding:12px;">シナリオデータが読み込めませんでした。ページを再読み込みしてください。</p>';
        return;
      }
      let state;
      try { state = KoreanState.getState(); } catch(e) { state = { conversation: { completedScenarios: [] } }; }
      const list = document.getElementById('scenario-list');
      list.innerHTML = '';
      scenarios.forEach(s => {
        const done = state.conversation.completedScenarios.includes(s.id);
        const div = document.createElement('div');
        div.className = 'scenario-card';
        div.innerHTML = `
          <span class="scenario-emoji">${s.emoji}</span>
          <div class="scenario-info">
            <div class="scenario-name">${s.name} <span style="font-weight:400; color:var(--muted); font-size:0.875rem;">/ ${s.nameKr}</span></div>
            <div class="scenario-desc">${s.description}</div>
          </div>
          ${done ? '<span class="scenario-done">✓</span>' : '<span style="color:var(--muted); font-size:1.25rem;">›</span>'}
        `;
        div.onclick = () => startChat(s);
        list.appendChild(div);
      });
      kpUpdateApiNotice();
    }

    // ── APIキー管理（GitHub Pages版） ──
    function kpIsLocalMode() {
      const h = location.hostname;
      return h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.') || h.startsWith('10.');
    }
    function kpGetApiKey() { return localStorage.getItem('anthropic-api-key') || ''; }
    function kpShowApiKeyModal() {
      document.getElementById('kp-api-input').value = kpGetApiKey();
      document.getElementById('kp-api-modal').style.display = 'flex';
    }
    function kpCloseApiKeyModal() { document.getElementById('kp-api-modal').style.display = 'none'; }
    function kpSaveApiKey() {
      const key = document.getElementById('kp-api-input').value.trim();
      if (key) localStorage.setItem('anthropic-api-key', key);
      else localStorage.removeItem('anthropic-api-key');
      kpCloseApiKeyModal();
      KoreanNav.showToast(key ? '✓ APIキーを保存しました' : 'APIキーを削除しました');
      kpUpdateApiNotice();
    }
    function kpUpdateApiNotice() {
      const notice = document.getElementById('kp-api-notice');
      if (notice) notice.style.display = (!kpIsLocalMode() && !kpGetApiKey()) ? 'flex' : 'none';
    }

    // チャット開始
    function startChat(scenario) {
      currentScenario = scenario;
      messages = [];
      sessionWords = 0;
      sessionTurns = 0;

      document.getElementById('chat-title').textContent = `${scenario.emoji} ${scenario.name}`;
      document.getElementById('chat-area').innerHTML = '';

      // ウェルカムメッセージ
      addAIMessage({
        reply_kr: '어서 오세요! 무엇을 도와드릴까요?',
        reply_jp: 'いらっしゃいませ！何かお手伝いしましょうか？',
        romanization: 'eo-seo o-se-yo! mu-eot-eul do-wa-deu-ril-kka-yo?',
        correction: null,
        vocabulary: [{ kr: '어서 오세요', jp: 'いらっしゃいませ' }]
      });

      // ボトムナビを非表示
      document.getElementById('bottom-nav').style.display = 'none';

      KoreanNav.showScreen('screen-chat');
      document.getElementById('chat-input').focus();
    }

    // チャット終了
    function endChat() {
      KoreanNav.stopListening && KoreanSpeech.stopListening();
      document.getElementById('bottom-nav').style.display = 'flex';
      showSummary();
    }

    // サマリー表示
    function showSummary() {
      if (currentScenario && sessionTurns > 0) {
        KoreanState.completeConversationSession(currentScenario.id);
        KoreanState.updateStreak();
      }
      document.getElementById('summary-scenario').textContent =
        currentScenario ? `${currentScenario.emoji} ${currentScenario.name}での会話` : '';
      document.getElementById('summary-turns').textContent = sessionTurns;
      document.getElementById('summary-words').textContent = sessionWords;
      KoreanNav.showScreen('screen-summary');
    }

    function restartChat() {
      if (currentScenario) startChat(currentScenario);
    }

    // メッセージ送信
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || isSending) return;

      input.value = '';
      autoResize(input);
      addUserMessage(text);
      messages.push({ role: 'user', content: text });
      sessionTurns++;

      await callAPI();
    }

    let isSending = false;

    async function callAPI() {
      if (isSending) return;
      isSending = true;

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      const chatArea = document.getElementById('chat-area');

      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      chatArea.appendChild(typing);
      scrollToBottom();

      let fullText = '';
      let previewBubble = null;

      try {
        let resp;
        if (kpIsLocalMode()) {
          resp = await fetch('/api/korean-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ system: currentScenario.systemPrompt, messages })
          });
        } else {
          const apiKey = kpGetApiKey();
          if (!apiKey) {
            if (typing.parentNode) typing.remove();
            isSending = false; sendBtn.disabled = false;
            kpShowApiKeyModal();
            return;
          }
          resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 600,
              stream: true,
              system: currentScenario.systemPrompt,
              messages
            })
          });
        }

        if (!resp.ok) {
          if (resp.status === 401) {
            if (typing.parentNode) typing.remove();
            isSending = false; sendBtn.disabled = false;
            addErrorMessage('APIキーが無効または期限切れです。⚙️ から正しいキーを再設定してください。');
            kpShowApiKeyModal();
            return;
          }
          if (resp.status === 429) throw new Error('レート制限に達しました。しばらく待ってから再試行してください。');
          let detail = '';
          try { const b = await resp.json(); detail = b.error?.message || ''; } catch {}
          throw new Error(`サーバーエラー (${resp.status})${detail ? ': ' + detail : ''}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let lineBuf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          lineBuf += decoder.decode(value, { stream: true });
          const lines = lineBuf.split('\n');
          lineBuf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]' || raw === '[ERROR]') break;
            try {
              const ev = JSON.parse(raw);
              const text = ev.t ??
                (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta' ? ev.delta.text : null);
              if (text) {
                fullText += text;
                // reply_kr フィールドが揃ったらすぐ表示
                const m = fullText.match(/"reply_kr"\s*:\s*"((?:[^"\\]|\\.)*)"/);
                if (m && !previewBubble) {
                  typing.remove();
                  previewBubble = document.createElement('div');
                  previewBubble.className = 'msg-bubble msg-ai';
                  previewBubble.innerHTML = '<div class="reply-kr" id="stream-kr"></div>';
                  chatArea.appendChild(previewBubble);
                  scrollToBottom();
                }
                if (previewBubble) {
                  const m2 = fullText.match(/"reply_kr"\s*:\s*"((?:[^"\\]|\\.)*)"/);
                  if (m2) document.getElementById('stream-kr').textContent = m2[1];
                }
              }
            } catch {}
          }
        }

        if (typing.parentNode) typing.remove();
        if (previewBubble) previewBubble.remove();

        const clean = fullText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
        let parsed;
        try { parsed = JSON.parse(clean); }
        catch { parsed = { reply_kr: fullText, reply_jp: '', romanization: '', correction: null, vocabulary: [] }; }

        addAIMessage(parsed);
        messages.push({ role: 'assistant', content: fullText });

      } catch (err) {
        if (typing.parentNode) typing.remove();
        if (previewBubble) previewBubble.remove();
        let msg = err.message || '通信エラーが発生しました。';
        if (!msg || msg === '[object Object]' || err.name === 'TypeError') {
          msg = 'ネットワークエラー：接続を確認し、APIキー（⚙️）が正しいか確認してください。';
        }
        addErrorMessage(msg);
        console.error(err);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }

    function addUserMessage(text) {
      const area = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = 'msg-bubble msg-user';
      div.textContent = text;
      area.appendChild(div);
      scrollToBottom();
    }

    function addAIMessage(data) {
      const area = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = 'msg-bubble msg-ai';

      let html = `<div class="reply-kr">${escHtml(data.reply_kr || '')}</div>`;
      if (data.romanization) {
        html += `<div class="reply-romanization">${escHtml(data.romanization)}</div>`;
      }
      if (data.reply_jp) {
        html += `<div class="reply-jp">${escHtml(data.reply_jp)}</div>`;
      }
      if (data.correction) {
        html += `<div class="correction-box">✏️ <strong>添削:</strong> ${escHtml(data.correction)}</div>`;
      }
      if (data.vocabulary && data.vocabulary.length > 0) {
        html += `<div class="vocab-area">`;
        data.vocabulary.forEach(v => {
          html += `<button class="vocab-chip" onclick="addToWordbook('${escAttr(v.kr)}', '${escAttr(v.jp)}')">📖 ${escHtml(v.kr)} <span style="color:#64748B">${escHtml(v.jp)}</span></button>`;
        });
        html += `</div>`;
      }

      div.innerHTML = html;

      // 読み上げボタン
      const speakBtn = document.createElement('button');
      speakBtn.className = 'btn btn-ghost btn-sm';
      speakBtn.style.cssText = 'padding: 4px 8px; font-size: 0.75rem; margin-top: 6px;';
      speakBtn.innerHTML = '🔊 聞く';
      speakBtn.onclick = () => KoreanSpeech.speak(data.reply_kr || '');
      div.appendChild(speakBtn);

      area.appendChild(div);
      scrollToBottom();
    }

    function addErrorMessage(text) {
      const area = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = 'msg-bubble msg-ai';
      div.style.borderColor = '#FEE2E2';
      div.style.background = '#FFF5F5';
      div.innerHTML = `<span style="color:var(--danger);">⚠️ ${escHtml(text)}</span>`;
      area.appendChild(div);
      scrollToBottom();
    }

    function addToWordbook(kr, jp) {
      const added = KoreanState.addWord({ kr, jp, source: '会話練習' });
      if (added) {
        sessionWords++;
        KoreanNav.showToast(`📖 「${kr}」を単語帳に追加しました`);
      } else {
        KoreanNav.showToast('すでに単語帳に登録済みです');
      }
    }

    function scrollToBottom() {
      const area = document.getElementById('chat-area');
      area.scrollTop = area.scrollHeight;
    }

    // 音声入力
    let isListening = false;
    function toggleMic() {
      const btn = document.getElementById('mic-btn');
      if (isListening) {
        KoreanSpeech.stopListening();
        isListening = false;
        btn.classList.remove('listening');
        btn.textContent = '🎤';
      } else {
        isListening = true;
        btn.classList.add('listening');
        btn.textContent = '⏹';
        KoreanSpeech.startListening(
          'ko-KR',
          (text, isFinal) => {
            document.getElementById('chat-input').value = text;
            if (isFinal) {
              isListening = false;
              btn.classList.remove('listening');
              btn.textContent = '🎤';
            }
          },
          (err) => {
            isListening = false;
            btn.classList.remove('listening');
            btn.textContent = '🎤';
            if (err === 'not_supported') {
              KoreanNav.showToast('音声入力はこのブラウザでサポートされていません');
            }
          }
        );
      }
    }

    function handleInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // エスケープ
    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof SCENARIOS === 'undefined' || !SCENARIOS) {
        document.getElementById('scenario-list').innerHTML =
          '<p style="color:red;padding:16px;">シナリオデータの読み込みに失敗しました。ページを再読み込みしてください。</p>';
        return;
      }
      renderScenarios();
    });
  </script>
</body>
