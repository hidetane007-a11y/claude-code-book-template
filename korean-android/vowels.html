<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F59E0B">
  <title>母音練習 | 韓国語学習</title>
  <link rel="manifest" href="/korean-android/manifest.json">
  <link rel="apple-touch-icon" href="/korean-android/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/korean-android/css/app.css">
  <style>
    .diff-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--vowel); margin-right: 2px; }

    .lesson-char {
      font-size: 6rem; font-weight: 700;
      text-align: center; margin: 16px 0 4px;
      line-height: 1;
    }

    .lesson-roman {
      text-align: center; font-size: 1.375rem;
      color: var(--muted); margin-bottom: 18px;
    }

    .tip-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #92400E;
    }

    .word-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .minimal-pair-area { display: flex; gap: 8px; flex-wrap: wrap; }
    .pair-btn {
      background: #EFF6FF;
      color: var(--primary);
      border: none;
      border-radius: 99px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pair-btn:active { background: #DBEAFE; }

    .listen-quiz {
      text-align: center;
      padding: 24px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <!-- ===== 母音マップ ===== -->
  <div id="screen-map" class="screen active">
    <div class="page-wrap">
      <div class="page-header">
        <a href="/korean-android/" class="back-btn">←</a>
        <h1>🔊 母音発音練習</h1>
        <span style="font-size:0.8125rem;color:var(--muted);" id="map-progress">0/21</span>
      </div>
      <div class="page-content">
        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:4px;">
            <span style="width:12px;height:12px;border-radius:3px;border:2px solid var(--success);background:#ECFDF5;display:inline-block;"></span>習得済み
          </span>
          <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:4px;">
            <span style="width:12px;height:12px;border-radius:3px;border:2px solid var(--vowel);background:#FFFBEB;display:inline-block;"></span>練習中
          </span>
          <span style="font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:4px;">
            <span style="width:12px;height:12px;border-radius:3px;border:2px solid var(--border);display:inline-block;"></span>未習得
          </span>
        </div>
        <div class="vowel-grid" id="vowel-grid"></div>
        <div class="card" style="text-align:center;padding:14px;">
          <p style="font-size:0.875rem;color:var(--muted);line-height:1.6;">
            母音をタップして練習を始めよう。<br>発音を聞いて・真似して・聞き分ける。
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 個別レッスン ===== -->
  <div id="screen-lesson" class="screen">
    <div class="page-wrap">
      <div class="page-header">
        <button class="back-btn" onclick="KoreanNav.showScreen('screen-map');renderMap();">←</button>
        <h1 id="lesson-title">ㅏ の練習</h1>
      </div>
      <div class="page-content">
        <div class="lesson-char" id="lesson-char"></div>
        <div class="lesson-roman" id="lesson-roman"></div>

        <button class="btn btn-vowel btn-full btn-lg mb-12" id="play-btn" onclick="playSound()">
          🔊 音を聞く
        </button>

        <div class="tip-box" id="lesson-tip"></div>
        <div class="tip-box" id="lesson-mouth" style="background:#EFF6FF;border-color:#BFDBFE;color:#1E40AF;"></div>

        <div class="section-title mt-16">例単語</div>
        <div id="example-words"></div>

        <div class="section-title mt-16">紛らわしい母音と比較</div>
        <div class="minimal-pair-area" id="minimal-pairs"></div>

        <div class="mt-20" style="display:flex;gap:10px;">
          <button class="btn btn-outline btn-full" onclick="KoreanNav.showScreen('screen-map');renderMap();">マップへ戻る</button>
          <button class="btn btn-vowel btn-full" onclick="markDone()">✓ 習得した</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a href="/korean-android/"><span class="nav-icon">🏠</span>ホーム</a>
    <a href="/korean-android/wordbook.html"><span class="nav-icon">📖</span>単語帳</a>
    <a href="/korean-android/vowels.html" class="active"><span class="nav-icon">🔊</span>母音</a>
  </nav>

  <!-- スクリプト読み込み順：state → speech → nav → データ(インライン) → ページコード -->
  <script src="/korean-android/js/state.js"></script>
  <script src="/korean-android/js/speech.js"></script>
  <script src="/korean-android/js/nav.js"></script>

  <!-- 母音データをインラインで定義 -->
  <script>
  window.VOWELS = [
    { char:'ㅏ', rom:'a',   sound:'아', diff:1, hint:'日本語の「ア」に近い', mouth:'口を大きく開けて「ア」と発音', words:[{kr:'아이',jp:'子供',rom:'a-i'},{kr:'사랑',jp:'愛',rom:'sa-rang'},{kr:'바나나',jp:'バナナ',rom:'ba-na-na'}], pairs:['ㅓ','ㅗ'] },
    { char:'ㅓ', rom:'eo',  sound:'어', diff:3, hint:'口をやや開けて「オ」と「ア」の中間', mouth:'口を横に開かず、やや前に出して「オ」', words:[{kr:'어머니',jp:'お母さん',rom:'eo-meo-ni'},{kr:'뭐',jp:'何',rom:'mwo'},{kr:'언니',jp:'お姉さん',rom:'eon-ni'}], pairs:['ㅏ','ㅗ'] },
    { char:'ㅗ', rom:'o',   sound:'오', diff:1, hint:'日本語の「オ」に近いが唇をより丸める', mouth:'唇をしっかり丸めて突き出す', words:[{kr:'오빠',jp:'お兄さん（女性から）',rom:'o-ppa'},{kr:'오늘',jp:'今日',rom:'o-neul'},{kr:'고양이',jp:'猫',rom:'go-yang-i'}], pairs:['ㅓ','ㅜ'] },
    { char:'ㅜ', rom:'u',   sound:'우', diff:1, hint:'日本語の「ウ」に近いが唇をより丸める', mouth:'唇を前に突き出して「ウ」', words:[{kr:'우리',jp:'私たち',rom:'u-ri'},{kr:'구름',jp:'雲',rom:'gu-reum'},{kr:'우산',jp:'傘',rom:'u-san'}], pairs:['ㅡ','ㅗ'] },
    { char:'ㅡ', rom:'eu',  sound:'으', diff:3, hint:'日本語にない音。口を横に引いて「ウ」', mouth:'唇を横に引いたまま、口の奥で「ウ」を発音', words:[{kr:'으로',jp:'〜へ・で（助詞）',rom:'eu-ro'},{kr:'크다',jp:'大きい',rom:'keu-da'},{kr:'음악',jp:'音楽',rom:'eu-mak'}], pairs:['ㅜ','ㅣ'] },
    { char:'ㅣ', rom:'i',   sound:'이', diff:1, hint:'日本語の「イ」とほぼ同じ', mouth:'口を横に引いて「イ」', words:[{kr:'이름',jp:'名前',rom:'i-reum'},{kr:'시간',jp:'時間',rom:'si-gan'},{kr:'미래',jp:'未来',rom:'mi-rae'}], pairs:['ㅡ','ㅔ'] },
    { char:'ㅐ', rom:'ae',  sound:'애', diff:2, hint:'日本語の「エ」よりも口を大きく開ける', mouth:'口を「ア」と「エ」の中間ぐらい開けて発音', words:[{kr:'애인',jp:'恋人',rom:'ae-in'},{kr:'개',jp:'犬',rom:'gae'},{kr:'배',jp:'梨・船・배',rom:'bae'}], pairs:['ㅔ','ㅏ'] },
    { char:'ㅔ', rom:'e',   sound:'에', diff:2, hint:'日本語の「エ」に近い（ㅐよりやや口を閉じる）', mouth:'口を少し開けて「エ」（現代語ではㅐとほぼ同音）', words:[{kr:'에서',jp:'〜で（助詞）',rom:'e-seo'},{kr:'세계',jp:'世界',rom:'se-gye'},{kr:'메뉴',jp:'メニュー',rom:'me-nyu'}], pairs:['ㅐ','ㅣ'] },
    { char:'ㅑ', rom:'ya',  sound:'야', diff:1, hint:'日本語の「ヤ」と同じ', mouth:'「イ」から素早く「ア」へ移動', words:[{kr:'야채',jp:'野菜',rom:'ya-chae'},{kr:'야구',jp:'野球',rom:'ya-gu'},{kr:'야',jp:'おい（呼びかけ）',rom:'ya'}], pairs:['ㅏ','ㅕ'] },
    { char:'ㅕ', rom:'yeo', sound:'여', diff:2, hint:'「ヨ」に近いが「eo（어）」の口で発音', mouth:'「イ」から素早く「어」へ移動', words:[{kr:'여기',jp:'ここ',rom:'yeo-gi'},{kr:'여행',jp:'旅行',rom:'yeo-haeng'},{kr:'여자',jp:'女性',rom:'yeo-ja'}], pairs:['ㅓ','ㅛ'] },
    { char:'ㅛ', rom:'yo',  sound:'요', diff:1, hint:'日本語の「ヨ」に近い', mouth:'「イ」から素早く「オ」へ移動', words:[{kr:'요리',jp:'料理',rom:'yo-ri'},{kr:'교실',jp:'教室',rom:'gyo-sil'},{kr:'요즘',jp:'最近',rom:'yo-jeum'}], pairs:['ㅗ','ㅕ'] },
    { char:'ㅠ', rom:'yu',  sound:'유', diff:1, hint:'日本語の「ユ」に近い', mouth:'「イ」から素早く「ウ」へ移動', words:[{kr:'유명',jp:'有名',rom:'yu-myeong'},{kr:'유리',jp:'ガラス',rom:'yu-ri'},{kr:'유튜브',jp:'YouTube',rom:'yu-tyu-beu'}], pairs:['ㅜ','ㅛ'] },
    { char:'ㅘ', rom:'wa',  sound:'와', diff:2, hint:'日本語の「ワ」に近い', mouth:'「ウ」から素早く「ア」へ移動', words:[{kr:'와',jp:'わあ！',rom:'wa'},{kr:'과자',jp:'お菓子',rom:'gwa-ja'},{kr:'화이팅',jp:'ファイティング！',rom:'hwa-i-ting'}], pairs:['ㅏ','ㅝ'] },
    { char:'ㅝ', rom:'wo',  sound:'워', diff:3, hint:'「ウォ」と発音（ウからオへ）', mouth:'「ウ」から素早く「어」へ移動', words:[{kr:'워낙',jp:'もともと・非常に',rom:'wo-nak'},{kr:'뭐',jp:'何',rom:'mwo'},{kr:'권리',jp:'権利',rom:'gwon-ri'}], pairs:['ㅓ','ㅘ'] },
    { char:'ㅚ', rom:'oe',  sound:'외', diff:3, hint:'ドイツ語の「ö」に近い（口をオ形にしてエ）', mouth:'唇を「オ」の形に丸めて「エ」と発音', words:[{kr:'외국',jp:'外国',rom:'oe-guk'},{kr:'외롭다',jp:'孤独だ',rom:'oe-rop-da'},{kr:'최고',jp:'最高',rom:'choe-go'}], pairs:['ㅔ','ㅗ'] },
    { char:'ㅞ', rom:'we',  sound:'웨', diff:3, hint:'「ウェ」と発音', mouth:'「ウ」から「エ」へ移動', words:[{kr:'웨이터',jp:'ウェイター',rom:'we-i-teo'},{kr:'궤도',jp:'軌道',rom:'gwe-do'},{kr:'웨',jp:'（感嘆）',rom:'we'}], pairs:['ㅔ','ㅚ'] },
    { char:'ㅟ', rom:'wi',  sound:'위', diff:2, hint:'「ウィ」と発音（唇を丸めてイ）', mouth:'「ウ」から素早く「イ」へ移動', words:[{kr:'위',jp:'上・胃',rom:'wi'},{kr:'위험',jp:'危険',rom:'wi-heom'},{kr:'귀',jp:'耳',rom:'gwi'}], pairs:['ㅣ','ㅜ'] },
    { char:'ㅢ', rom:'ui',  sound:'의', diff:3, hint:'日本語にない音。「ウイ」を一音節で', mouth:'「eu（으）」の口で「イ」を発音。または「エ」の音になることも', words:[{kr:'의사',jp:'医者',rom:'ui-sa'},{kr:'의미',jp:'意味',rom:'ui-mi'},{kr:'희망',jp:'希望',rom:'hi-mang'}], pairs:['ㅡ','ㅣ'] },
    { char:'ㅒ', rom:'yae', sound:'얘', diff:2, hint:'「ヤ」と「エ」の中間（ヤエ）', mouth:'「イ」から「ㅐ(ae)」へ素早く移動', words:[{kr:'얘기',jp:'話・おしゃべり',rom:'yae-gi'},{kr:'얘',jp:'こいつ・この子',rom:'yae'},{kr:'걔',jp:'あいつ',rom:'gyae'}], pairs:['ㅐ','ㅖ'] },
    { char:'ㅖ', rom:'ye',  sound:'예', diff:2, hint:'「イェ」と発音（ヤエよりも口が閉じ気味）', mouth:'「イ」から「ㅔ(e)」へ素早く移動', words:[{kr:'예쁘다',jp:'かわいい',rom:'ye-ppeu-da'},{kr:'예의',jp:'礼儀',rom:'ye-ui'},{kr:'네',jp:'はい',rom:'ne'}], pairs:['ㅔ','ㅒ'] },
    { char:'ㅙ', rom:'wae', sound:'왜', diff:2, hint:'「ウェ」に近い（ワとエの中間）', mouth:'「ウ」から「ㅐ(ae)」へ移動', words:[{kr:'왜',jp:'なぜ',rom:'wae'},{kr:'왜냐하면',jp:'なぜなら',rom:'wae-nya-ha-myeon'},{kr:'봐',jp:'見て（命令）',rom:'bwa'}], pairs:['ㅐ','ㅞ'] }
  ];
  </script>

  <script>
    let currentVowel = null;

    function renderMap() {
      const state = KoreanState.getState();
      const done = state.vowels.completed || [];
      const grid = document.getElementById('vowel-grid');
      grid.innerHTML = '';

      document.getElementById('map-progress').textContent = `${done.length}/21`;

      VOWELS.forEach(v => {
        const isDone   = done.includes(v.char);
        const isActive = state.vowels.current === v.char;
        const tile = document.createElement('div');
        tile.className = `vowel-tile${isDone ? ' done' : isActive ? ' active' : ''}`;
        tile.innerHTML = `
          <div class="vowel-char">${v.char}</div>
          <div class="vowel-roman">${v.rom}</div>
          ${isDone ? '<span class="vowel-check">✓</span>' : ''}
        `;
        tile.onclick = () => openLesson(v);
        grid.appendChild(tile);
      });
    }

    function openLesson(v) {
      currentVowel = v;
      document.getElementById('lesson-title').textContent = `${v.char} の練習`;
      document.getElementById('lesson-char').textContent = v.char;
      document.getElementById('lesson-roman').textContent = `[${v.rom}]  /  ${v.sound}`;
      document.getElementById('lesson-tip').textContent = '💡 ' + v.hint;
      document.getElementById('lesson-mouth').textContent = '👄 ' + v.mouth;

      // 例単語
      const wArea = document.getElementById('example-words');
      wArea.innerHTML = '';
      v.words.forEach(w => {
        const el = document.createElement('div');
        el.className = 'word-row';
        el.innerHTML = `
          <div style="flex:1;">
            <div class="word-kr">${escHtml(w.kr)}</div>
            <div class="word-jp">${escHtml(w.rom)} ／ ${escHtml(w.jp)}</div>
          </div>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="KoreanSpeech.speak('${escAttr(w.kr)}')">🔊</button>
        `;
        wArea.appendChild(el);
      });

      // ミニマルペア
      const pArea = document.getElementById('minimal-pairs');
      pArea.innerHTML = '';
      v.pairs.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'pair-btn';
        btn.textContent = p;
        btn.onclick = () => {
          const pv = VOWELS.find(x => x.char === p);
          if (pv) KoreanSpeech.speak(pv.sound);
        };
        pArea.appendChild(btn);
      });

      // 保存中にマーク
      const s = KoreanState.getState();
      s.vowels.current = v.char;
      KoreanState.saveState(s);

      KoreanNav.showScreen('screen-lesson');
      // 画面表示後に自動再生
      setTimeout(() => KoreanSpeech.speak(v.sound), 400);
    }

    function playSound() {
      if (currentVowel) KoreanSpeech.speak(currentVowel.sound);
    }

    function markDone() {
      if (!currentVowel) return;
      KoreanState.markVowelDone(currentVowel.char);
      KoreanState.updateStreak();
      KoreanNav.showToast(`✓「${currentVowel.char}」を習得しました！`);
      KoreanNav.showScreen('screen-map');
      renderMap();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
    }

    document.addEventListener('DOMContentLoaded', renderMap);
  </script>
</body>
</html>
