<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10B981">
  <title>会話練習 | 韓国語学習</title>
  <link rel="manifest" href="/korean-android/manifest.json">
  <link rel="apple-touch-icon" href="/korean-android/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/korean-android/css/app.css">
  <style>
    .scenario-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.12s;
    }
    .scenario-card:active { border-color: var(--conv); box-shadow: 0 2px 8px rgba(16,185,129,0.2); }
    .scenario-card + .scenario-card { margin-top: 10px; }
    .sc-emoji { font-size: 2.25rem; flex-shrink: 0; }
    .sc-info { flex: 1; }
    .sc-name { font-size: 1rem; font-weight: 700; }
    .sc-name-kr { font-size: 0.8125rem; color: var(--muted); }
    .sc-desc { font-size: 0.8125rem; color: var(--muted); margin-top: 2px; }
    .sc-done { color: var(--conv); font-size: 1.25rem; }

    /* チャット専用ヘッダー */
    #chat-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .api-key-btn { background:none;border:none;font-size:1.1rem;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted); }
    .api-key-notice { background:#FEF3C7;border:1px solid #F59E0B;border-radius:10px;padding:10px 14px;font-size:0.8125rem;margin-bottom:12px;display:flex;align-items:center;gap:8px; }
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px; }
    .modal-box { background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.2); }
    .modal-box input { width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:0.875rem;box-sizing:border-box;margin-bottom:12px; }
  </style>
</head>
<body>
  <div id="offline-banner" class="offline-banner">オフラインです。会話練習にはインターネット接続が必要です。</div>

  <!-- ===== シナリオ選択 ===== -->
  <div id="screen-scenarios" class="screen active">
    <div class="page-wrap">
      <div class="page-header">
        <a href="/korean-android/" class="back-btn">←</a>
        <h1>💬 会話練習</h1>
      </div>
      <div class="page-content">
        <div id="api-key-notice" class="api-key-notice" style="display:none">
          ⚠️ <span>Anthropic APIキーが未設定です。</span>
          <button class="btn btn-sm btn-outline" style="margin-left:auto;white-space:nowrap" onclick="showApiKeyModal()">設定する</button>
        </div>
        <div class="section-title">シナリオを選ぶ</div>
        <div id="scenario-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== チャット ===== -->
  <div id="chat-screen" class="screen">
    <div id="chat-header">
      <button class="back-btn" onclick="endChat()">←</button>
      <span id="chat-title" style="font-weight:700;font-size:1rem;flex:1;"></span>
      <button class="api-key-btn" onclick="showApiKeyModal()" title="APIキー設定">⚙️</button>
      <button class="btn btn-sm btn-outline" onclick="endChat()">終わる</button>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-wrap">
      <div class="chat-hint" id="chat-hint">日本語または韓国語でメッセージを送ってください</div>
      <div class="chat-row">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="音声入力">🎤</button>
        <textarea class="chat-textarea" id="chat-input" rows="1"
          placeholder="メッセージを入力..."
          onkeydown="handleKeydown(event)"
          oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- ===== サマリー ===== -->
  <div id="screen-summary" class="screen">
    <div class="page-wrap">
      <div class="page-header">
        <h1>💬 会話練習</h1>
      </div>
      <div class="page-content">
        <div class="summary-hero">
          <span class="s-emoji">🎉</span>
          <div class="s-title">お疲れさまでした！</div>
          <div class="s-sub" id="summary-scenario"></div>
        </div>
        <div class="stats-grid">
          <div class="card stat-box">
            <div class="stat-num" id="sum-turns">0</div>
            <div class="stat-lbl">会話ターン</div>
          </div>
          <div class="card stat-box">
            <div class="stat-num" id="sum-words">0</div>
            <div class="stat-lbl">追加単語</div>
          </div>
        </div>
        <button class="btn btn-conv btn-full btn-lg" onclick="restartChat()">もう一度</button>
        <button class="btn btn-outline btn-full btn-lg mt-12" onclick="KoreanNav.showScreen('screen-scenarios'); renderScenarios();">シナリオ選択へ</button>
        <a href="/korean-android/" class="btn btn-ghost btn-full mt-8">ホームへ</a>
      </div>
    </div>
  </div>

  <!-- ボトムナビ（チャット中は非表示） -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="/korean-android/"><span class="nav-icon">🏠</span>ホーム</a>
    <a href="/korean-android/wordbook.html"><span class="nav-icon">📖</span>単語帳</a>
    <a href="/korean-android/" class="active"><span class="nav-icon">💬</span>会話</a>
  </nav>

  <!-- APIキー設定モーダル -->
  <div id="api-key-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeApiKeyModal()">
    <div class="modal-box">
      <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px;">🔑 Anthropic APIキー設定</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:14px;">GitHub Pages版の会話練習に必要です。キーはこのデバイスのみに保存されます。</div>
      <input id="api-key-input" type="password" placeholder="sk-ant-..." autocomplete="off">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="closeApiKeyModal()">キャンセル</button>
        <button class="btn btn-conv btn-sm" style="flex:1" onclick="saveApiKey()">保存</button>
      </div>
      <div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--conv);">APIキーを取得する →</a>
      </div>
    </div>
  </div>

  <!-- スクリプト読み込み順：state → speech → nav → データ(インライン) → ページコード -->
  <script src="/korean-android/js/state.js"></script>
  <script src="/korean-android/js/speech.js"></script>
  <script src="/korean-android/js/nav.js"></script>

  <!-- シナリオデータをインラインで定義（外部ファイル読み込み失敗を防ぐ） -->
  <script>

    },

  <script>
    // ── APIキー管理（GitHub Pages版） ──
    function isLocalMode() {
      const h = location.hostname;
      return h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.') || h.startsWith('10.');
    }
    function getStoredApiKey() { return localStorage.getItem('anthropic-api-key') || ''; }
    function showApiKeyModal() {
      document.getElementById('api-key-input').value = getStoredApiKey();
      document.getElementById('api-key-modal').style.display = 'flex';
    }
    function closeApiKeyModal() { document.getElementById('api-key-modal').style.display = 'none'; }
    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) localStorage.setItem('anthropic-api-key', key);
      else localStorage.removeItem('anthropic-api-key');
      closeApiKeyModal();
      KoreanNav.showToast(key ? '✓ APIキーを保存しました' : 'APIキーを削除しました');
      updateApiKeyNotice();
    }
    function updateApiKeyNotice() {
      const notice = document.getElementById('api-key-notice');
      if (notice) notice.style.display = (!isLocalMode() && !getStoredApiKey()) ? 'flex' : 'none';
    }

    let currentScenario = null;
    let messages = [];
    let sessionWords = 0;
    let sessionTurns = 0;
    let isSending = false;
    let micListening = false;

    // ── シナリオ描画 ──
    function renderScenarios() {
      const list = document.getElementById('scenario-list');
      // ガードチェック（スキル教訓: データが未定義なら即エラー表示）
      if (typeof SCENARIOS === 'undefined' || !SCENARIOS.length) {
        list.innerHTML = '<p style="color:var(--danger);padding:12px;">シナリオデータを読み込めませんでした。ページを再読み込みしてください。</p>';
        return;
      }
      let state;
      try { state = KoreanState.getState(); } catch { state = { conversation: { completedScenarios: [] } }; }
      list.innerHTML = '';
      SCENARIOS.forEach(s => {
        const done = state.conversation.completedScenarios.includes(s.id);
        const el = document.createElement('div');
        el.className = 'scenario-card';
        el.innerHTML = `
          <span class="sc-emoji">${s.emoji}</span>
          <div class="sc-info">
            <div class="sc-name">${escHtml(s.name)} <span style="font-weight:400;color:var(--muted);font-size:0.875rem;">/ ${escHtml(s.nameKr)}</span></div>
            <div class="sc-desc">${escHtml(s.desc)}</div>
          </div>
          ${done
            ? '<span class="sc-done">✓</span>'
            : '<span style="color:var(--muted);font-size:1.25rem;">›</span>'}
        `;
        el.onclick = () => startChat(s);
        list.appendChild(el);
      });
      updateApiKeyNotice();
    }

    // ── チャット開始 ──
    function startChat(scenario) {
      currentScenario = scenario;
      messages = [];
      sessionWords = 0;
      sessionTurns = 0;

      document.getElementById('chat-title').textContent = `${scenario.emoji} ${scenario.name}`;
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('bottom-nav').style.display = 'none';

      appendAI({
        reply_kr: '어서 오세요! 무엇을 도와드릴까요?',
        reply_jp: 'いらっしゃいませ！何かお手伝いしましょうか？',
        romanization: 'eo-seo o-se-yo! mu-eot-eul do-wa-deu-ril-kka-yo?',
        correction: null,
        vocabulary: [{ kr: '어서 오세요', jp: 'いらっしゃいませ' }]
      });

      KoreanNav.showScreen('chat-screen');
      document.getElementById('chat-input').focus();
    }

    function endChat() {
      KoreanSpeech.stopListening();
      document.getElementById('bottom-nav').style.display = 'flex';
      showSummary();
    }

    function showSummary() {
      if (currentScenario && sessionTurns > 0) {
        KoreanState.completeConversation(currentScenario.id);
        KoreanState.updateStreak();
      }
      document.getElementById('summary-scenario').textContent =
        currentScenario ? `${currentScenario.emoji} ${currentScenario.name}での会話` : '';
      document.getElementById('sum-turns').textContent = sessionTurns;
      document.getElementById('sum-words').textContent = sessionWords;
      KoreanNav.showScreen('screen-summary');
    }

    function restartChat() { if (currentScenario) startChat(currentScenario); }

    // ── メッセージ送信 ──
    async function sendMessage() {
      const el = document.getElementById('chat-input');
      const text = el.value.trim();
      if (!text || isSending) return;

      el.value = '';
      autoResize(el);
      appendUser(text);
      messages.push({ role: 'user', content: text });
      sessionTurns++;

      await callStream();
    }

    // ── SSEストリーミング（スキル教訓: /api/korean-stream を使う、flushHeaders が鍵） ──
    async function callStream() {
      if (isSending) return;
      isSending = true;

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      const area = document.getElementById('chat-messages');

      const typing = document.createElement('div');
      typing.className = 'typing-dots';
      typing.innerHTML = '<span></span><span></span><span></span>';
      area.appendChild(typing);
      scrollBottom();

      let fullText = '';
      let preview = null;

      try {
        let resp;
        if (isLocalMode()) {
          resp = await fetch('/api/korean-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ system: currentScenario.system, messages })
          });
        } else {
          const apiKey = getStoredApiKey();
          if (!apiKey) {
            if (typing.parentNode) typing.remove();
            isSending = false; sendBtn.disabled = false;
            showApiKeyModal();
            return;
          }
          resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 600,
              stream: true,
              system: currentScenario.system,
              messages
            })
          });
        }

        if (!resp.ok) throw new Error('サーバーエラー ' + resp.status);

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]' || raw === '[ERROR]') break;
            try {
              const ev = JSON.parse(raw);
              const text = ev.t ??
                (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta' ? ev.delta.text : null);
              if (text) {
                fullText += text;
                // reply_kr が揃ったら先行表示（体感速度改善）
                const m = fullText.match(/"reply_kr"\s*:\s*"((?:[^"\\]|\\.)*)"/);
                if (m && !preview) {
                  typing.remove();
                  preview = document.createElement('div');
                  preview.className = 'bubble bubble-ai';
                  preview.innerHTML = '<div class="b-kr" id="stream-kr-live"></div>';
                  area.appendChild(preview);
                  scrollBottom();
                }
                if (preview) {
                  const m2 = fullText.match(/"reply_kr"\s*:\s*"((?:[^"\\]|\\.)*)"/);
                  if (m2) {
                    const el2 = document.getElementById('stream-kr-live');
                    if (el2) el2.textContent = m2[1];
                  }
                }
              }
            } catch {}
          }
        }

        if (typing.parentNode) typing.remove();
        if (preview) preview.remove();

        const clean = fullText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
        let parsed;
        try { parsed = JSON.parse(clean); }
        catch { parsed = { reply_kr: fullText, reply_jp: '', romanization: '', correction: null, vocabulary: [] }; }

        appendAI(parsed);
        messages.push({ role: 'assistant', content: fullText });

      } catch (err) {
        if (typing.parentNode) typing.remove();
        if (preview) preview.remove();
        appendError('通信エラーが発生しました。もう一度お試しください。');
        console.error('[korean] stream error:', err);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }

    // ── バブル追加 ──
    function appendUser(text) {
      const area = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'bubble bubble-user';
      el.textContent = text;
      area.appendChild(el);
      scrollBottom();
    }

    function appendAI(data) {
      const area = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'bubble bubble-ai';

      let html = `<div class="b-kr">${escHtml(data.reply_kr || '')}</div>`;
      if (data.romanization) html += `<div class="b-rom">${escHtml(data.romanization)}</div>`;
      if (data.reply_jp)     html += `<div class="b-jp">${escHtml(data.reply_jp)}</div>`;
      if (data.correction)   html += `<div class="b-correction">✏️ <strong>添削:</strong> ${escHtml(data.correction)}</div>`;

      if (data.vocabulary && data.vocabulary.length > 0) {
        html += '<div class="b-vocab">';
        data.vocabulary.forEach(v => {
          html += `<button class="vocab-chip" onclick="addWord('${escAttr(v.kr)}','${escAttr(v.jp)}')">📖 ${escHtml(v.kr)} <span style="color:#64748B">${escHtml(v.jp)}</span></button>`;
        });
        html += '</div>';
      }

      el.innerHTML = html;

      const speakBtn = document.createElement('button');
      speakBtn.className = 'btn btn-ghost btn-sm';
      speakBtn.style.cssText = 'padding:4px 8px;font-size:0.75rem;margin-top:5px;';
      speakBtn.innerHTML = '🔊 聞く';
      speakBtn.onclick = () => KoreanSpeech.speak(data.reply_kr || '');
      el.appendChild(speakBtn);

      area.appendChild(el);
      scrollBottom();
    }

    function appendError(text) {
      const area = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'bubble bubble-ai';
      el.style.cssText = 'border-color:#FEE2E2;background:#FFF5F5;';
      el.innerHTML = `<span style="color:var(--danger);">⚠️ ${escHtml(text)}</span>`;
      area.appendChild(el);
      scrollBottom();
    }

    function addWord(kr, jp) {
      const added = KoreanState.addWord({ kr, jp, source: '会話練習' });
      if (added) {
        sessionWords++;
        KoreanNav.showToast(`📖「${kr}」を単語帳に追加しました`);
      } else {
        KoreanNav.showToast('すでに登録済みです');
      }
    }

    function scrollBottom() {
      const area = document.getElementById('chat-messages');
      area.scrollTop = area.scrollHeight;
    }

    // ── 音声入力 ──
    function toggleMic() {
      const btn = document.getElementById('mic-btn');
      if (micListening) {
        KoreanSpeech.stopListening();
        micListening = false;
        btn.classList.remove('listening');
        btn.textContent = '🎤';
      } else {
        micListening = true;
        btn.classList.add('listening');
        btn.textContent = '⏹';
        KoreanSpeech.startListening(
          'ko-KR',
          (text, isFinal) => {
            document.getElementById('chat-input').value = text;
            autoResize(document.getElementById('chat-input'));
            if (isFinal) {
              micListening = false;
              btn.classList.remove('listening');
              btn.textContent = '🎤';
            }
          },
          (err) => {
            micListening = false;
            btn.classList.remove('listening');
            btn.textContent = '🎤';
            if (err === 'not_supported') {
              KoreanNav.showToast('音声入力はこのブラウザでサポートされていません');
            }
          }
        );
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // ガードチェック（スキル教訓）
      if (typeof SCENARIOS === 'undefined' || !SCENARIOS) {
        document.getElementById('scenario-list').innerHTML =
          '<p style="color:var(--danger);padding:16px;">シナリオデータの読み込みに失敗しました。ページを再読み込みしてください。</p>';
        return;
      }
      renderScenarios();
    });
  </script>
</body>
</html>
