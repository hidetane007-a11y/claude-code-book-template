<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文アプリ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>🍽️ ご注文</h1>
  <button id="cart-btn">
    🛒 カート
    <span id="cart-count">0</span>
  </button>
</header>

<div class="tabs" id="tabs"></div>
<div class="menu-grid" id="menu-grid"></div>

<!-- Cart Sidebar -->
<div id="cart-overlay"></div>
<div id="cart-sidebar">
  <div class="cart-header">
    <h2>🛒 カート</h2>
    <button class="close-btn" id="close-cart-btn">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>合計</span>
      <span id="cart-total-price">¥0</span>
    </div>
    <button class="checkout-btn" id="checkout-btn" disabled>注文内容を確認する</button>
  </div>
</div>

<!-- Order Modal -->
<div id="modal-overlay">
  <div class="modal">
    <h2>注文内容の確認</h2>

    <div class="type-toggle">
      <button class="type-btn active" data-type="delivery">🛵 デリバリー</button>
      <button class="type-btn" data-type="takeout">🏃 テイクアウト</button>
    </div>

    <div class="modal-order-summary">
      <p id="summary-items"></p>
      <p class="summary-total">合計: <span id="summary-total"></span></p>
    </div>

    <div class="form-group">
      <label>お名前 *</label>
      <input type="text" id="customer-name" placeholder="田中太郎">
      <span class="form-error" id="name-error">お名前を入力してください</span>
    </div>

    <div class="form-group">
      <label>電話番号 *</label>
      <input type="tel" id="customer-phone" placeholder="090-1234-5678">
      <span class="form-error" id="phone-error">正しい電話番号を入力してください</span>
    </div>

    <div class="form-group" id="address-group">
      <label>配達先住所 *</label>
      <input type="text" id="customer-address" placeholder="東京都渋谷区1-1-1">
      <span class="form-error" id="address-error">配達先住所を入力してください</span>
    </div>

    <div class="form-group">
      <label>希望時間（任意）</label>
      <input type="time" id="scheduled-time">
    </div>

    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">戻る</button>
      <button class="modal-confirm" id="modal-confirm">注文を確定する</button>
    </div>
  </div>
</div>

<!-- Complete Screen -->
<div id="complete-screen">
  <div class="check">✅</div>
  <h2>ご注文ありがとうございます！</h2>
  <p>注文番号</p>
  <p class="order-id" id="complete-order-id"></p>
  <p>ご準備が整いましたらご連絡いたします。</p>
  <button class="back-btn" id="back-to-menu">メニューに戻る</button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
