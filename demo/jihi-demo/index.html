<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>デモ版ログイン</title>
<style>
:root {
  --navy: #1F3A5F;
  --teal: #0E9F9A;
  --red:  #C0392B;
  --gray: #555555;
  --bg:   #F7FAFB;
  --white:#FFFFFF;
  --border:#DCE6EC;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  padding-left: max(24px, env(safe-area-inset-left));
  padding-right: max(24px, env(safe-area-inset-right));
  font-family: "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--navy);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}

.login {
  width: 100%;
  max-width: 400px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px 28px;
}
.login__title {
  font-size: 20px;
  margin: 0 0 6px;
  border-left: 5px solid var(--teal);
  padding-left: 12px;
}
.login__sub {
  margin: 0 0 22px 17px;
  font-size: 13px;
  color: var(--gray);
}

.login__label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}
.login__input {
  font-family: inherit;
  /* 16px 未満だと iOS Safari が入力時に勝手にズームする */
  font-size: 16px;
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--navy);
  background: var(--white);
}
.login__input:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

.login__btn {
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  width: 100%;
  margin-top: 16px;
  padding: 13px;
  border: none;
  border-radius: 7px;
  background: var(--teal);
  color: var(--white);
  cursor: pointer;
  touch-action: manipulation;
}
.login__btn:hover:enabled { background: #0C8C88; }
.login__btn:disabled { background: #B7C6CE; cursor: default; }

.login__msg {
  display: none;
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 7px;
  font-size: 13px;
  line-height: 1.7;
}
.login__msg--on { display: block; }
.login__msg--error { background: #FDF4F3; color: var(--red); border-left: 3px solid var(--red); }
.login__msg--info  { background: #EEF3F6; color: var(--gray); border-left: 3px solid var(--teal); }

.login__note {
  margin: 20px 0 0;
  font-size: 11.5px;
  color: var(--gray);
  line-height: 1.7;
}
</style>
</head>
<body>

<noscript>
  <div class="login">
    <h1 class="login__title">JavaScript が無効です</h1>
    <p class="login__sub">
      Safari の設定 →「詳細」→「JavaScript」をオンにしてから開き直してください。
    </p>
  </div>
</noscript>

<form class="login" id="loginForm" autocomplete="off">
  <h1 class="login__title">デモ版ログイン</h1>
  <p class="login__sub">お渡ししたパスワードを入力してください</p>

  <label class="login__label" for="pw">パスワード</label>
  <input class="login__input" type="password" id="pw" name="password"
         autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">

  <button class="login__btn" type="submit" id="submitBtn">開く</button>

  <div class="login__msg" id="msg"></div>

  <p class="login__note">
    デモに表示されるデータはすべて架空のサンプルです。実在の患者さんの情報は含まれていません。
  </p>
</form>

  var ITERATIONS = 200000;
  var SALT_LEN   = 16;
  var IV_LEN     = 12;
  var SS_KEY     = 'jihi-demo-pw';

  var form   = document.getElementById('loginForm');
  var input  = document.getElementById('pw');
  var button = document.getElementById('submitBtn');
  var msgBox = document.getElementById('msg');

  function showMessage(text, kind) {
    msgBox.textContent = text;
    msgBox.className = 'login__msg login__msg--on login__msg--' + kind;
  }
  function clearMessage() {
    msgBox.className = 'login__msg';
  }

  function base64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // sessionStorage は Safari のプライベートブラウズで例外を投げることがある
  function session(action, value) {
    try {
      if (action === 'get') return window.sessionStorage.getItem(SS_KEY);
      if (action === 'set') window.sessionStorage.setItem(SS_KEY, value);
      if (action === 'clear') window.sessionStorage.removeItem(SS_KEY);
    } catch (e) { /* 使えなくてもログイン自体はできるので握りつぶす */ }
    return null;
  }

  function decrypt(password) {
    var raw  = base64ToBytes(PAYLOAD);
    var salt = raw.subarray(0, SALT_LEN);
    var iv   = raw.subarray(SALT_LEN, SALT_LEN + IV_LEN);
    var data = raw.subarray(SALT_LEN + IV_LEN);
    var subtle = window.crypto.subtle;

    return subtle.importKey(
      'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    ).then(function (baseKey) {
      return subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    }).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  }

  function open(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function attempt(password, fromSession) {
    button.disabled = true;
    input.disabled = true;
    showMessage('確認中です。少しお待ちください…', 'info');

    // 復号は端末によって数秒かかる。先に「確認中」を描画させてから走らせる。
    setTimeout(function () {
      decrypt(password).then(function (html) {
        session('set', password);
        open(html);
      }).catch(function () {
        session('clear');
        button.disabled = false;
        input.disabled = false;
        input.value = '';
        input.focus();
        showMessage(
          fromSession
            ? 'もう一度パスワードを入力してください。'
            : 'パスワードが違います。大文字・小文字とハイフンをご確認ください。',
          'error'
        );
      });
    }, 30);
  }

  if (!window.crypto || !window.crypto.subtle) {
    // http:// で開いた場合やブラウザが古い場合はここに来る
    button.disabled = true;
    showMessage(
      'このブラウザではデモを開けません。https:// のURLを、Safari または Chrome の最新版で開いてください。',
      'error'
    );
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearMessage();
    var pw = input.value.trim();
    if (!pw) {
      showMessage('パスワードを入力してください。', 'error');
      input.focus();
      return;
    }
    attempt(pw, false);
  });

  // 同じタブで一度ログインしていれば、リロードしても入力し直さなくてよい
  var saved = session('get');
  if (saved) {
    attempt(saved, true);
  } else {
    input.focus();
  }
})();
</script>
