<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ご注文 [v15]</title>
  <script>if(location.search.indexOf('v=15')<0){location.replace(location.pathname+'?v=15');}</script>
  <link rel="stylesheet" href="css/style.css?v=15">
  <link rel="stylesheet" href="css/order.css?v=15">
</head>
<body>

<header>
  <h1>🍽️ ご注文</h1>
  <button class="cart-header-btn" id="cart-header-btn">
    🛒 カート <span class="cart-badge" id="cart-badge">0</span>
  </button>
</header>

<div class="main-grid">

  <!-- Left: Menu -->
  <div class="menu-area">
    <div class="tabs" id="tabs"></div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <!-- Right: Cart Panel (landscape=static / portrait=slide-in) -->
  <div class="cart-panel" id="cart-panel">
    <div class="cart-panel-head">
      <h2>🛒 カート</h2>
      <button class="cart-close-btn" id="cart-close-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="cart-empty">カートは空です</p>
    </div>
    <div class="cart-panel-footer">
      <div class="cart-total">
        <span>合計</span>
        <span id="cart-total-price">¥0</span>
      </div>
      <button class="checkout-btn" id="checkout-btn" disabled>注文内容を確認する</button>
    </div>
  </div>

</div>

<!-- Cart overlay (portrait only) -->
<div id="cart-overlay"></div>

<!-- Portrait bottom summary bar -->
<div class="cart-bottom-bar hidden" id="cart-bottom-bar">
  <div class="cart-bottom-info">
    <span class="cart-bottom-count" id="cart-bottom-count">0点</span>
    <span class="cart-bottom-total" id="cart-bottom-total">¥0</span>
  </div>
  <button class="cart-bottom-btn" id="cart-bottom-btn" disabled>カートを見る</button>
</div>

<!-- Order Modal -->
<div id="modal-overlay">
  <div class="modal">
    <h2>注文内容の確認</h2>

    <div class="modal-order-summary">
      <p id="summary-items"></p>
      <p class="summary-total">合計: <span id="summary-total"></span></p>
    </div>

    <div class="form-group">
      <label>お名前 *</label>
      <input type="text" id="customer-name" placeholder="たなか たろう"
             inputmode="kana" autocomplete="name">
      <span class="form-error" id="name-error">お名前を入力してください</span>
    </div>

    <div class="form-group">
      <label>電話番号 *</label>
      <input type="tel" id="customer-phone" placeholder="090-1234-5678" autocomplete="tel">
      <span class="form-error" id="phone-error">正しい電話番号を入力してください</span>
    </div>

    <div class="form-group">
      <label>注文タイプ</label>
      <div class="order-timing-toggle">
        <button class="timing-btn active" data-timing="now">🍽️ 店内</button>
        <button class="timing-btn" data-timing="reserve">📅 予約注文</button>
      </div>
    </div>

    <div id="reservation-fields">
      <div class="form-group">
        <label>希望日 *</label>
        <input type="date" id="scheduled-date">
        <span class="form-error" id="date-error">翌日以降の日付を選択してください</span>
      </div>
      <div class="form-group">
        <label>希望時間 *</label>
        <input type="time" id="scheduled-time">
        <span class="form-error" id="time-error">時間を入力してください</span>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">戻る</button>
      <button class="modal-confirm" id="modal-confirm">注文を確定する</button>
    </div>
  </div>
</div>

<!-- Complete Screen -->
<div id="complete-screen">
  <div class="check">✅</div>
  <h2>ご注文ありがとうございます！</h2>
  <p>注文番号</p>
  <p class="order-id" id="complete-order-id"></p>
  <p id="complete-message"></p>
  <button class="back-btn" id="back-to-menu">メニューに戻る</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js?v=15"></script>
<script src="js/data.js?v=15"></script>
<script src="js/app.js?v=15"></script>
</body>
</html>
