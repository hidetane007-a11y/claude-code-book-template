<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8B5CF6">
  <title>하다動詞ドリル | 韓国語学習</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <!-- ===== ステージ選択 ===== -->
  <div id="screen-stages" class="screen active">
    <div class="page-wrap">
      <div class="page-header">
        <a href="./" class="back-btn">←</a>
        <h1>📝 하다動詞ドリル</h1>
      </div>
      <div class="page-content">
        <div class="section-title">ステージを選ぶ</div>
        <div id="stage-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== インプット（説明・例文） ===== -->
  <div id="screen-input" class="screen">
    <div class="page-wrap">
      <div class="page-header">
        <button class="back-btn" onclick="KoreanNav.showScreen('screen-stages');renderStages();">←</button>
        <h1 id="input-title">Stage 1</h1>
      </div>
      <div class="page-content">
        <div class="explanation-box" id="input-explanation"></div>
        <div class="section-title">例文</div>
        <div id="examples-list"></div>
        <div class="mt-20">
          <button class="btn btn-drill btn-full btn-lg" onclick="startDrill()">ドリルを始める →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ドリル問題 ===== -->
  <div id="screen-drill" class="screen">
    <div class="page-wrap">
      <div class="page-header">
        <button class="back-btn" onclick="confirmExit()">←</button>
        <h1 id="drill-title">ドリル</h1>
      </div>
      <div class="page-content">
        <div style="font-size:0.875rem;color:var(--muted);text-align:center;margin-bottom:12px;" id="drill-num">1 / 6</div>
        <div class="pbar mb-16"><div class="pbar-fill drill" id="drill-pbar" style="width:0%"></div></div>
        <div class="question-box" id="question-text"></div>
        <div id="answer-area"></div>
        <div id="feedback-area"></div>
        <div id="next-area" style="margin-top:14px;display:none;">
          <button class="btn btn-drill btn-full" onclick="nextQuestion()">次へ →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 結果 ===== -->
  <div id="screen-result" class="screen">
    <div class="page-wrap">
      <div class="page-header">
        <h1>📝 結果</h1>
      </div>
      <div class="page-content">
        <div class="result-circle">
          <div class="result-score" id="result-score">0</div>
          <div class="result-total" id="result-total">/ 0 問</div>
        </div>
        <p style="text-align:center;color:var(--muted);margin-bottom:20px;" id="result-msg"></p>
        <div id="unlock-msg" style="display:none;" class="card mb-12" style="border-color:var(--drill);">
          <p style="text-align:center;color:var(--drill);font-weight:600;">🎉 次のステージが解放されました！</p>
        </div>
        <button class="btn btn-drill btn-full btn-lg mb-12" onclick="retryDrill()">もう一度</button>
        <button class="btn btn-outline btn-full" onclick="KoreanNav.showScreen('screen-stages');renderStages();">ステージ選択へ</button>
      </div>
    </div>
  </div>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a href="./"><span class="nav-icon">🏠</span>ホーム</a>
    <a href="./wordbook.html"><span class="nav-icon">📖</span>単語帳</a>
    <a href="./drill.html" class="active"><span class="nav-icon">📝</span>ドリル</a>
  </nav>

  <!-- スクリプト読み込み順：state → speech → nav → データ(インライン) → ページコード -->
  <script src="./js/state.js"></script>
  <script src="./js/speech.js"></script>
  <script src="./js/nav.js"></script>

  <!-- ドリルデータをインラインで定義 -->
  <script>
  window.HADA_STAGES = [
    {
      stage: 1, title: '現在形', subtitle: '합니다 / 해요',
      explanation: '하다動詞の基本形。합니다はフォーマル（改まった場面）、해요はカジュアル丁寧（日常会話）に使います。',
      examples: [
        { kr: '공부해요', jp: '勉強します', romanization: 'gong-bu-hae-yo' },
        { kr: '일합니다', jp: '働きます（フォーマル）', romanization: 'il-ham-ni-da' },
        { kr: '운동해요', jp: '運動します', romanization: 'un-dong-hae-yo' }
      ],
      drills: [
        { type: 'translate', question: '「毎日勉強します」を韓国語で（해요体）', answer: '매일 공부해요', hint: '공부하다 → 공부해요' },
        { type: 'choice',    question: '「운동하다」の해요体は？', choices: ['운동해요','운동합니다','운동했어요','운동하고'], answer: '운동해요', hint: '하다 → 해요' },
        { type: 'translate', question: '「料理します」を韓国語で（해요体）', answer: '요리해요', hint: '요리하다 → 요리해요' },
        { type: 'choice',    question: '「일하다」の합니다体は？', choices: ['일해요','일합니다','일했어요','일하면'], answer: '일합니다', hint: '하다 → 합니다（フォーマル）' },
        { type: 'translate', question: '「電話します」を韓国語で（합니다体）', answer: '전화합니다', hint: '전화하다 → 전화합니다' },
        { type: 'choice',    question: '「노래하다」（歌う）の해요体は？', choices: ['노래합니다','노래해요','노래했어요','노래하고'], answer: '노래해요', hint: '하다 → 해요' }
      ]
    },
    {
      stage: 2, title: '過去・未来・否定', subtitle: '했어요 / 할 거예요 / 안 해요',
      explanation: '過去形は「했어요」、未来形は「할 거예요」、否定は「안 해요」または「하지 않아요」を使います。',
      examples: [
        { kr: '공부했어요', jp: '勉強しました', romanization: 'gong-bu-haess-eo-yo' },
        { kr: '내일 운동할 거예요', jp: '明日運動するつもりです', romanization: 'nae-il un-dong-hal geo-ye-yo' },
        { kr: '오늘은 일 안 해요', jp: '今日は仕事しません', romanization: 'o-neu-reun il an hae-yo' }
      ],
      drills: [
        { type: 'translate', question: '「昨日運動しました」を韓国語で', answer: '어제 운동했어요', hint: '운동하다 → 운동했어요（過去形）' },
        { type: 'choice',    question: '「공부하다」の過去形（해요体）は？', choices: ['공부할 거예요','공부해요','공부했어요','공부하지 않아요'], answer: '공부했어요', hint: '하다 → 했어요（過去）' },
        { type: 'translate', question: '「明日旅行します（予定）」を韓国語で', answer: '내일 여행할 거예요', hint: '여행하다 → 여행할 거예요（未来）' },
        { type: 'choice',    question: '「요리하다」の否定形（안）は？', choices: ['요리 안 해요','안 요리해요','요리없어요','요리하지해요'], answer: '요리 안 해요', hint: '動詞の前に「안」: 안 해요' },
        { type: 'translate', question: '「電話しませんでした」を韓国語で', answer: '전화 안 했어요', hint: '안 + 했어요' },
        { type: 'choice',    question: '「내년에 결혼할 거예요」の意味は？', choices: ['去年結婚しました','来年結婚するつもりです','結婚したくないです','明日結婚します'], answer: '来年結婚するつもりです', hint: '내년에 = 来年に、할 거예요 = するつもりです' }
      ]
    },
    {
      stage: 3, title: '接続形', subtitle: '하고 / 해서 / 하면',
      explanation: '하고は「して・と」（並列）、해서は「して・から」（理由/順序）、하면は「すれば・したら」（条件）を表します。',
      examples: [
        { kr: '공부하고 운동해요', jp: '勉強して運動します', romanization: 'gong-bu-ha-go un-dong-hae-yo' },
        { kr: '운동해서 건강해요', jp: '運動するので健康です', romanization: 'un-dong-hae-seo geon-gang-hae-yo' },
        { kr: '열심히 공부하면 합격해요', jp: '一生懸命勉強すれば合格します', romanization: 'yeol-sim-hi gong-bu-ha-myeon hap-gyeok-hae-yo' }
      ],
      drills: [
        { type: 'translate', question: '「働いて（から）休みます」を韓国語で', answer: '일해서 쉬어요', hint: '일하다 → 일해서（理由/順序）' },
        { type: 'choice',    question: '「공부하다」の하고形は？', choices: ['공부해서','공부하면','공부하고','공부했어요'], answer: '공부하고', hint: '하다 → 하고（並列・順序接続）' },
        { type: 'translate', question: '「料理すれば（したら）おいしいです」を韓国語で', answer: '요리하면 맛있어요', hint: '요리하다 → 요리하면（条件）' },
        { type: 'choice',    question: '「피곤해서 쉬어요」の意味は？', choices: ['疲れているので休みます','疲れたら休みます','疲れて休みません','休んで疲れました'], answer: '疲れているので休みます', hint: '피곤하다 = 疲れる、해서 = から/なので' },
        { type: 'translate', question: '「電話して話します」を韓国語で', answer: '전화하고 얘기해요', hint: '전화하다 → 전화하고（並列）' },
        { type: 'choice',    question: '「운동하면」の意味は？', choices: ['運動して','運動するから','運動すれば','運動した'], answer: '運動すれば', hint: 'はすれば（条件形）' }
      ]
    },
    {
      stage: 4, title: '尊敬語・進行形', subtitle: '하세요 / 하고 있어요',
      explanation: '尊敬語は「하세요」（〜してください/なさいます）、進行形は「하고 있어요」（〜しています）を使います。',
      examples: [
        { kr: '공부하세요', jp: 'お勉強なさいます / 勉強してください', romanization: 'gong-bu-ha-se-yo' },
        { kr: '지금 일하고 있어요', jp: '今仕事しています', romanization: 'ji-geum il-ha-go iss-eo-yo' },
        { kr: '여기서 기다리고 계세요', jp: 'こちらでお待ちになっています', romanization: 'yeo-gi-seo gi-da-ri-go gye-se-yo' }
      ],
      drills: [
        { type: 'translate', question: '「今勉強しています」を韓国語で（進行形）', answer: '지금 공부하고 있어요', hint: '공부하다 → 공부하고 있어요' },
        { type: 'choice',    question: '「운동하다」の尊敬語（하세요）は？', choices: ['운동해요','운동했어요','운동하세요','운동하고 있어요'], answer: '운동하세요', hint: '하다 → 하세요（尊敬語）' },
        { type: 'translate', question: '「料理してください（お願い）」を韓国語で', answer: '요리해 주세요', hint: '요리하다 → 요리해 주세요' },
        { type: 'choice',    question: '「일하고 있어요」の意味は？', choices: ['仕事します','仕事してください','仕事しています','仕事しました'], answer: '仕事しています', hint: 'はしています（進行形）' },
        { type: 'translate', question: '「先生は今お食事中です（尊敬）」を韓国語で', answer: '선생님은 지금 식사하고 계세요', hint: '식사하다 → 하고 계세요（尊敬・進行）' },
        { type: 'choice',    question: '「어서 오세요」の意味は？', choices: ['行ってください','いらっしゃいませ','ありがとうございます','お待ちください'], answer: 'いらっしゃいませ', hint: '어서 오세요 = いらっしゃいませ（定型表現）' }
      ]
    }
  ];
  </script>

  <script>
    let currentStage = null;
    let drillIdx = 0;
    let answered = false;
    let score = 0;

    function renderStages() {
      const state = KoreanState.getState();
      const list = document.getElementById('stage-list');
      list.innerHTML = '';

      HADA_STAGES.forEach(sd => {
        const done   = state.drill.completedStages.includes(sd.stage);
        const locked = sd.stage > state.drill.currentStage;
        const el = document.createElement('div');
        el.className = `stage-card${locked ? ' locked' : ''}${done ? ' done' : ''}`;
        el.innerHTML = `
          <div class="stage-num">${sd.stage}</div>
          <div style="flex:1;">
            <div style="font-size:1rem;font-weight:700;">${escHtml(sd.title)}</div>
            <div style="font-size:0.8125rem;color:var(--muted);">${escHtml(sd.subtitle)}</div>
          </div>
          <div>${done ? '<span style="color:var(--drill);font-size:1.375rem;">✓</span>' : locked ? '🔒' : '<span style="color:var(--muted);">›</span>'}</div>
        `;
        el.onclick = () => locked
          ? KoreanNav.showToast('前のステージをクリアしてください')
          : showInput(sd);
        list.appendChild(el);
      });
    }

    function showInput(sd) {
      currentStage = sd;
      document.getElementById('input-title').textContent = `Stage ${sd.stage}: ${sd.title}`;
      document.getElementById('input-explanation').textContent = sd.explanation;

      const list = document.getElementById('examples-list');
      list.innerHTML = '';
      sd.examples.forEach(ex => {
        const el = document.createElement('div');
        el.className = 'example-row';
        el.innerHTML = `
          <div style="flex:1;">
            <div class="ex-kr">${escHtml(ex.kr)}</div>
            <div class="ex-sub">${escHtml(ex.romanization)} ／ ${escHtml(ex.jp)}</div>
          </div>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="KoreanSpeech.speak('${escAttr(ex.kr)}')">🔊</button>
        `;
        list.appendChild(el);
      });

      KoreanNav.showScreen('screen-input');
    }

    function startDrill() {
      if (!currentStage) return;
      drillIdx = 0;
      score = 0;
      answered = false;
      document.getElementById('drill-title').textContent = `Stage ${currentStage.stage}: ${currentStage.title}`;
      renderQuestion();
      KoreanNav.showScreen('screen-drill');
    }

    function renderQuestion() {
      const drills = currentStage.drills;
      const d = drills[drillIdx];
      const total = drills.length;

      answered = false;
      document.getElementById('drill-num').textContent = `${drillIdx + 1} / ${total}`;
      document.getElementById('drill-pbar').style.width = `${(drillIdx / total) * 100}%`;
      document.getElementById('question-text').textContent = d.question;
      document.getElementById('feedback-area').innerHTML = '';
      document.getElementById('next-area').style.display = 'none';

      const area = document.getElementById('answer-area');
      area.innerHTML = '';

      if (d.type === 'choice') {
        d.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = c;
          btn.onclick = () => checkChoice(c, d);
          area.appendChild(btn);
        });
      } else {
        area.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <input type="text" class="input" id="translate-input"
              placeholder="韓国語で入力してください"
              autocomplete="off" autocorrect="off" autocapitalize="off"
              spellcheck="false">
            <button class="btn btn-drill btn-full" onclick="checkTranslate()">確認する</button>
            <button class="btn btn-ghost btn-full btn-sm" onclick="KoreanNav.showToast('💡 ' + currentStage.drills[drillIdx].hint)">ヒントを見る</button>
          </div>
        `;
        document.getElementById('translate-input').addEventListener('keydown', e => {
          if (e.key === 'Enter') checkTranslate();
        });
        setTimeout(() => document.getElementById('translate-input')?.focus(), 120);
      }
    }

    function checkChoice(selected, d) {
      if (answered) return;
      answered = true;
      const ok = selected === d.answer;
      if (ok) score++;

      document.querySelectorAll('.choice-btn').forEach(btn => {
        if (btn.textContent === d.answer) btn.classList.add('correct');
        else if (btn.textContent === selected && !ok) btn.classList.add('wrong');
        btn.disabled = true;
      });

      showFeedback(ok, d.answer, d.hint);
    }

    function checkTranslate() {
      if (answered) return;
      const input = document.getElementById('translate-input');
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      answered = true;
      const d = currentStage.drills[drillIdx];
      const ok = val === d.answer || val.replace(/\s+/g,'') === d.answer.replace(/\s+/g,'');
      if (ok) score++;
      input.disabled = true;

      showFeedback(ok, d.answer, d.hint);
    }

    function showFeedback(ok, answer, hint) {
      document.getElementById('feedback-area').innerHTML = `
        <div class="feedback-box ${ok ? 'correct' : 'wrong'}">
          ${ok ? '✅ 正解！' : `❌ 不正解。正解は「${escHtml(answer)}」`}
          ${hint ? `<br><span style="font-size:0.8125rem;opacity:0.8;">💡 ${escHtml(hint)}</span>` : ''}
        </div>
      `;
      document.getElementById('next-area').style.display = 'block';
    }

    function nextQuestion() {
      drillIdx++;
      if (drillIdx >= currentStage.drills.length) showResult();
      else renderQuestion();
    }

    function showResult() {
      const total = currentStage.drills.length;
      const allOk = score === total;
      const wasCompleted = KoreanState.getState().drill.completedStages.includes(currentStage.stage);

      if (allOk) {
        KoreanState.completeDrillStage(currentStage.stage, score);
        KoreanState.updateStreak();
      }

      document.getElementById('result-score').textContent = score;
      document.getElementById('result-total').textContent = `/ ${total} 問`;

      const pct = Math.round((score / total) * 100);
      document.getElementById('result-msg').textContent =
        pct === 100 ? '完璧！全問正解です！' :
        pct >= 80  ? 'すばらしい！もう少しで完璧！' :
        pct >= 60  ? 'よく頑張りました！復習して再挑戦！' :
                    'もう一度挑戦してみましょう！';

      document.getElementById('unlock-msg').style.display =
        (allOk && !wasCompleted && currentStage.stage < 4) ? 'block' : 'none';

      KoreanNav.showScreen('screen-result');
    }

    function retryDrill() { startDrill(); }

    function confirmExit() {
      if (drillIdx === 0 || confirm('ドリルを中断しますか？')) {
        KoreanNav.showScreen('screen-input');
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
    }

    document.addEventListener('DOMContentLoaded', renderStages);
  </script>
</body>
</html>
